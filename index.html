<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Store</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icons/favicon-512x512.png">
</head>
<body>
     <header class="app-header">
        <div>
            <h1>Pocket Store</h1>
            <p>Catálogo de productos</p>
        </div>

        <span id="connection-status">
            Conectando...
        </span>
    </header>

    <main class="container">

        <section class="hero">
            <h2>Productos</h2>
            <p>
                Consulta el catálogo incluso cuando no tengas conexión.
            </p>
        </section>

        <section id="products" class="products">
            <p class="loading">
                Cargando productos...
            </p>
        </section>

    </main>

    <footer>
        <p>Pocket Store · PWA</p>
    </footer>

    <script src="app.js"></script>
    
</body>
</html>
